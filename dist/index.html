    const p = def.team === 'them' ? null : sel;
    const ev = { id: CC.uid(), s: cur, p, t, at: Date.now() };
    Store.change((st) => { const gg = st.games[g.id]; gg.events = (gg.events || []).concat(ev); if (gg.status === 'plan') gg.status = 'live'; }, [g.id]);
    const who = p ? byId[p].name : def.team === 'them' ? g.opponent : 'Team';
    toast(def.label + ' · ' + who, { label: 'Undo', fn: () => Store.change((st) => { st.games[g.id].events = st.games[g.id].events.filter((e) => e.id !== ev.id); }, [g.id]) });
    setSel(null);
  }
  function go(i) { Store.change((st) => { st.games[g.id].cur = i; if (st.games[g.id].status === 'plan') st.games[g.id].status = 'live'; }, [g.id]); setSel(null); }
  function doSub(inId) {
    Store.change((st) => { const t = st.games[g.id].shifts[cur]; const l = CC.lineupOf(st.games[g.id], cur).slice(); const i = l.indexOf(subOut); if (i >= 0) l[i] = inId; else l.push(inId); t.actual = l; }, [g.id]);
    toast(byId[inId].name + ' in for ' + byId[subOut].name);
    setSubOut(null);
  }
  const recent = (g.events || []).slice(-6).reverse();
  const line = (id) => { const l = A.players[id] || CC.emptyLine(); const bits = []; if (l.pts) bits.push(l.pts + ' pts'); if (l.reb) bits.push(l.reb + ' reb'); if (l.stl) bits.push(l.stl + ' stl'); if (l.ast) bits.push(l.ast + ' ast'); if (l.hus) bits.push(l.hus + ' hustle'); return bits.join(' · ') || 'No stats yet'; };
  return html`<section class="tab-page live">
    <div class="page-head"><div><h1 class="display">Game day</h1><p class="muted">Tap a player, then what they did. Tap a stat with nobody picked to credit the team.</p></div><${GamePicker} gameId=${gameId} setGameId=${setGameId} /></div>
    <div class="scoreboard">
      <div class="sb-team"><span class="sb-name">${s.team.name}</span><span class="sb-score">${A.us}</span></div>
      <div class="sb-mid">
        <div class="shift-step big"><button class="icon-btn" disabled=${cur === 0} onClick=${() => go(cur - 1)} aria-label="Previous shift"><${Icon} name="back" /></button><span class="sb-shift">${CC.shiftLabel(g, cur, true)}</span><button class="icon-btn" disabled=${cur >= N - 1} onClick=${() => go(cur + 1)} aria-label="Next shift"><${Icon} name="next" /></button></div>
        <span class="sb-sub">This shift ${ss.us}–${ss.them}</span>
        ${g.status === 'final' ? html`<span class="chip good">Final</span>` : null}
      </div>
      <div class="sb-team them"><span class="sb-name">${g.opponent}</span><span class="sb-score">${A.them}</span></div>
    </div>
    <div class="live-actions">
      <button class="btn big-act" onClick=${() => setShowTO(true)}><${Icon} name="users" /> Timeout</button>
      <button class="btn big-act" onClick=${() => setShowPlays(true)}><${Icon} name="ball" /> Plays</button>
      <button class="btn big-act" onClick=${() => openHuddle(g.id, cur)}><${Icon} name="full" /> Where to stand</button>
    </div>
    ${g.status !== 'final' ? html`<${ClockPanel} g=${g} go=${go} />` : null}
    <div class="live-grid">
      <div class="panel">
        <div class="panel-head"><h2>On the court</h2><button class="btn small" onClick=${() => openHuddle(g.id, cur)}><${Icon} name="full" /> Show the team</button></div>
        <div class="oncourt">
          ${lineup.map((id) => html`<div class=${'oc-tile' + (sel === id ? ' sel' : '')} key=${id}>
            <button class="oc-main" aria-pressed=${sel === id} onClick=${() => setSel(sel === id ? null : id)}><${Avatar} p=${byId[id]} size=${56} /><span class="oc-name">${byId[id].name} <span class="muted">#${byId[id].number}</span></span><span class="oc-line">${line(id)}</span></button>
            <button class="link-btn small" onClick=${() => setSubOut(id)}><${Icon} name="swap" size=${14} /> Sub</button>
          </div>`)}
          ${!lineup.length ? html`<p class="muted">Nobody is planned for this shift. Fill it in on the Game plan tab.</p>` : null}
        </div>
      </div>
      <div class="panel">
        <h2>${sel ? byId[sel].name : 'Team'}</h2>
        <div class="pad">${PAD.map(([t, label, kind]) => html`<button class=${'pad-btn ' + kind} onClick=${() => log(t)}>${label}</button>`)}</div>
        <h3 class="pad-sub">${g.opponent} scored</h3>
        <div class="pad opp">${['opp2', 'opp1', 'opp3'].map((t) => html`<button class="pad-btn opp" onClick=${() => log(t)}>+${CC.EVENTS[t].pts}</button>`)}</div>
        <div class="log">${recent.map((e) => html`<div class="log-row"><span class="muted small">${CC.shiftLabel(g, e.s)}</span><span>${CC.EVENTS[e.t].label}</span><span class="grow muted">${e.p ? byId[e.p] && byId[e.p].name : CC.EVENTS[e.t].team === 'them' ? g.opponent : 'Team'}</span><button class="icon-btn small" aria-label="Remove" onClick=${() => Store.change((st) => { st.games[g.id].events = st.games[g.id].events.filter((x) => x.id !== e.id); }, [g.id])}><${Icon} name="x" size=${14} /></button></div>`)}</div>
      </div>
    </div>
    <div class="row gap end">
      ${g.status !== 'final' ? html`<button class="btn primary" onClick=${() => ask('End the game?', 'The game moves to Review, where you can see how each rotation did.', 'End game', () => { Store.change((st) => { st.games[g.id].status = 'final'; st.games[g.id].cur = N - 1; }, [g.id]); location.hash = 'review'; })}>End game and review</button>`
        : html`<button class="btn" onClick=${() => Store.change((st) => { st.games[g.id].status = 'live'; }, [g.id])}>Reopen game</button><a class="btn primary" href="#review">See the review</a>`}
    </div>
    <${Dialog} open=${!!subOut} onClose=${() => setSubOut(null)} title=${subOut ? 'Who goes in for ' + byId[subOut].name + '?' : ''}>
      <div class="sub-grid">${bench.map((id) => html`<button class="attend-btn on" onClick=${() => doSub(id)}><${Avatar} p=${byId[id]} size=${36} /><span>${byId[id].name}</span></button>`)}</div>
      ${!bench.length ? html`<p class="muted">Everyone who's here is already on the court.</p>` : null}
      <p class="small muted">The sub only changes this shift. Stats for the rest of the shift go to the new group.</p>
    </${Dialog}>
    ${showTO ? html`<${TimeoutCard} g=${g} onClose=${() => setShowTO(false)} openPlay=${(id) => openPlayHuddle(id, { gameId: g.id })} />` : null}
    ${showPlays ? html`<${PlayPicker} g=${g} onClose=${() => setShowPlays(false)} openPlay=${(id) => openPlayHuddle(id, { gameId: g.id })} />` : null}
    ${confirmEl}
  </section>`;
}

/* ---------- Review: how each rotation worked ---------- */
function ShiftChart({ g, A }) {
  const N = CC.nShifts(g);
  const W = 640, H = 170, pad = 28, bw = (W - pad * 2) / N;
  const maxv = Math.max(4, ...A.shiftScore.map((x) => Math.abs(x.us - x.them)));
  const mid = H / 2 + 6;
  const sc = (v) => (v / maxv) * (H / 2 - 30);
  return html`<svg class="shiftchart" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label="Score difference for each shift">
    <line x1=${pad} x2=${W - pad} y1=${mid} y2=${mid} class="axis" />
    ${A.shiftScore.slice(0, N).map((x, i) => {
      const d = x.us - x.them, hgt = Math.max(2, Math.abs(sc(d))), xx = pad + i * bw + bw * 0.18;
      return html`<g key=${i}>
        <rect x=${xx} width=${bw * 0.64} y=${d >= 0 ? mid - hgt : mid} height=${hgt} rx="3" class=${d > 0 ? 'bar-pos' : d < 0 ? 'bar-neg' : 'bar-even'} />
        <text x=${xx + bw * 0.32} y=${d >= 0 ? mid - hgt - 6 : mid + hgt + 14} class="bar-lbl" text-anchor="middle">${x.us}–${x.them}</text>
        <text x=${xx + bw * 0.32} y=${H - 4} class="axis-lbl" text-anchor="middle">${CC.shiftLabel(g, i)}</text>
      </g>`;
    })}
    <text x=${pad} y="14" class="axis-lbl">Our points minus theirs, by shift</text>
  </svg>`;
}

function Faces({ ids, size = 24 }) { const byId = rosterById(); return html`<span class="mini-faces">${ids.filter((id) => byId[id]).map((id) => html`<span title=${byId[id].name}><${Avatar} p=${byId[id]} size=${size} /></span>`)}</span>`; }

function aiReviewPrompt(g, A, season) {
  const byId = rosterById();
  const shifts = A.shiftScore.slice(0, CC.nShifts(g)).map((x, i) => `${CC.shiftLabel(g, i, true)}: ${CC.lineupOf(g, i).map((id) => (byId[id] || {}).name).join(', ')} | ${x.us}-${x.them}`);
  const players = (g.present || []).filter((id) => byId[id]).map((id) => {
    const l = A.players[id] || CC.emptyLine(); const p = byId[id];
    return `${id} | ${p.name} | shifts ${l.shifts} | pts ${l.pts} (${l.fgm}/${l.fga} FG, ${l.ftm} FT) reb ${l.reb} stl ${l.stl} ast ${l.ast} hustle ${l.hus} to ${l.to} | on-court ${signed(l.pm)} | ratings ${CC.SKILLS.map((s) => CC.rating(p, s.k)).join(',')}`;
  });
  return `You are an encouraging, practical assistant coach for a youth basketball team (3rd-4th grade). Review this game for the head coach.

Game: ${Store.s.team.name} ${A.us}, ${g.opponent} ${A.them} (${fmtDate(g.date)}). Team points with no player credited: ${A.teamUnassigned}.
Shifts (lineup | score in that shift):
${shifts.join('\n')}

Players (id | name | stats this game | ratings 1-4 for dribbling, passing, shooting, defense, rebounding, spacing, hustle, confidence):
${players.join('\n')}

Season so far: ${season.record.w}-${season.record.l}${season.record.t ? '-' + season.record.t : ''} in ${season.games.length} tracked games.

Guidance: these are 8-10 year olds. Small samples are noisy (one shift is a hint, not proof). Celebrate effort stats (rebounds, steals, hustle, assists) as much as points. Turnovers are for the coach only and are normal at this age. Suggest concrete, simple changes.

Reply with only JSON:
{"headline":"6-10 word summary","recap":"3-4 sentences for the coach","kidRecap":"2 positive sentences the coach can read to the team","worked":["up to 3 things that worked, naming lineups or players"],"change":["up to 3 specific adjustments for next game"],"shoutouts":{"player id":"one specific, positive sentence for that kid"},"focus":{"player id":{"skill":"one of drib,pass,shoot,def,reb,space,hustle,conf","why":"short reason"}},"practice":[{"drill":"name","minutes":10,"why":"short reason"}]}`;
}

function AIReview({ g, A, season }) {
  const aiOk = useAIAvailable();
  const [st, setSt] = useState({ phase: 'idle' });
  const ctl = useRef(null);
  const saved = g.ai && g.ai.review;
  const byId = rosterById();
  async function run() {
    const sample = await AI.get();
    if (!sample) { setSt({ phase: 'error', msg: AI.message({ code: 'not_granted' }) }); return; }
    ctl.current = new AbortController();
    setSt({ phase: 'thinking' });
    try {
      const r = await sample.json(aiReviewPrompt(g, A, season), { signal: ctl.current.signal, cache: false });
      const clean = { headline: String(r.headline || ''), recap: String(r.recap || ''), kidRecap: String(r.kidRecap || ''), worked: (r.worked || []).map(String).slice(0, 3), change: (r.change || []).map(String).slice(0, 3),
        shoutouts: {}, focus: {}, practice: Array.isArray(r.practice) ? r.practice.slice(0, 5).map((d) => ({ drill: String(d.drill || ''), minutes: +d.minutes || 10, why: String(d.why || '') })) : [], at: Date.now() };
      Object.keys(r.shoutouts || {}).forEach((id) => { if (byId[id]) clean.shoutouts[id] = String(r.shoutouts[id]); });
      Object.keys(r.focus || {}).forEach((id) => { const f = r.focus[id]; if (byId[id] && f && CC.SKILLS.some((s) => s.k === f.skill)) clean.focus[id] = { skill: f.skill, why: String(f.why || '') }; });
      Store.change((s) => { s.games[g.id].ai = { ...(s.games[g.id].ai || {}), review: clean }; }, [g.id]);
      setSt({ phase: 'idle' });
    } catch (e) { setSt({ phase: 'error', msg: AI.message(e) }); }
  }
  return html`<div class="panel ai-review">
    <div class="panel-head"><h2><span class="ai-badge"><${Icon} name="spark" /> Claude</span> Coach's report</h2>
      ${st.phase !== 'thinking' && aiOk !== false ? html`<button class="btn ai" onClick=${run}>${saved ? 'Write a new report' : 'Write the report'}</button>` : null}</div>
    ${aiOk === false ? html`<p class="muted">Claude isn't available on this page right now. The numbers above still tell the story.</p>` : null}
    ${st.phase === 'thinking' ? html`<div class="thinking"><span class="dots"><i></i><i></i><i></i></span> Claude is reviewing every shift and stat.<button class="btn" onClick=${() => ctl.current && ctl.current.abort()}>Stop</button></div>` : null}
    ${st.phase === 'error' ? html`<p class="error">${st.msg}</p>` : null}
    ${saved && st.phase !== 'thinking' ? html`<div class="report">
      <h3 class="display">${saved.headline}</h3>
      <p>${saved.recap}</p>
      <div class="kid-read"><span class="eyebrow">Read to the team</span><p>${saved.kidRecap}</p></div>
      <div class="two-col"><div><h4>What worked</h4><ul>${saved.worked.map((x) => html`<li>${x}</li>`)}</ul></div><div><h4>Try next game</h4><ul>${saved.change.map((x) => html`<li>${x}</li>`)}</ul></div></div>
      ${Object.keys(saved.shoutouts).length ? html`<h4>Shout-outs</h4><ul class="shout-list">${Object.entries(saved.shoutouts).map(([id, t]) => html`<li><${Avatar} p=${byId[id]} size=${28} /><span><b>${byId[id].name}:</b> ${t}</span></li>`)}</ul>` : null}
      ${saved.practice.length ? html`<h4>Practice this week</h4><ol class="drills">${saved.practice.map((d) => html`<li><b>${d.drill}</b> <span class="muted">${d.minutes} min</span><br /><span class="small">${d.why}</span></li>`)}</ol>` : null}
    </div>` : null}
    ${!saved && st.phase === 'idle' && aiOk !== false ? html`<p class="muted small">Claude reads every shift and stat, then writes a recap, what to change, a shout-out for each kid and a practice plan.</p>` : null}
  </div>`;
}

function ReviewTab({ gameId, setGameId }) {
  const s = useStore();
  const [scope, setScope] = useState('game');
  const tracked = (g) => g.status !== 'plan' || (g.events || []).length;
  const g = s.games[gameId] && tracked(s.games[gameId]) ? s.games[gameId] : sortedGames().find(tracked);
  const season = useMemo(() => CC.analyzeSeason(Object.values(s.games)), [s.games]);
  const byId = rosterById();
  if (!g) return html`<section class="tab-page"><h1 class="display">Review</h1><div class="empty">Track a game on Game day and the review shows up here.</div></section>`;
  const A = CC.analyzeGame(g.status === 'final' ? g : { ...g, status: 'live' });
  const result = A.us > A.them ? 'Win' : A.us < A.them ? 'Loss' : 'Tie';
  const L = scope === 'game' ? A.lineups.map((x) => ({ ...x, n: x.shifts.length })) : season.lineups.map((x) => ({ ...x, n: x.shifts }));
  const lineups = L.slice().sort((a, b) => b.pm / b.n - a.pm / a.n || b.n - a.n);
  const P = scope === 'game' ? A.players : season.players;
  const pairsSrc = scope === 'game' ? A.pairs : season.pairs;
  const minPair = scope === 'game' ? 2 : 3;
  const pairs = pairsSrc.filter((x) => x.shifts >= minPair).sort((a, b) => b.pm / b.shifts - a.pm / a.shifts);
  const ids = Object.keys(P).filter((id) => byId[id]).sort((a, b) => (P[b].pts + P[b].reb + P[b].stl + P[b].ast) - (P[a].pts + P[a].reb + P[a].stl + P[a].ast));
  const cols = [['shifts', 'Shifts'], ['pts', 'Pts'], ['fg', 'FG'], ['reb', 'Reb'], ['stl', 'Stl'], ['ast', 'Ast'], ['hus', 'Hustle'], ['to', 'TO'], ['pm', '+/-']];
  const maxOf = {}; cols.forEach(([k]) => { maxOf[k] = Math.max(1, ...ids.map((id) => P[id][k] || 0)); });
  const fair = CC.shiftCounts(g, (g.present || []).filter((id) => byId[id]), true);
  const fv = Object.values(fair);
  return html`<section class="tab-page">
    <div class="page-head"><div><h1 class="display">${scope === 'game' ? 'vs ' + g.opponent : 'Season review'}</h1><p class="muted">${scope === 'game' ? fmtDate(g.date) + (g.status === 'final' ? '' : ' · in progress') : season.games.length + ' tracked games · ' + season.record.w + '-' + season.record.l + (season.record.t ? '-' + season.record.t : '')}</p></div>
      <div class="row gap wrap"><div class="seg two"><button class=${'seg-btn' + (scope === 'game' ? ' on' : '')} onClick=${() => setScope('game')}>This game</button><button class=${'seg-btn' + (scope === 'season' ? ' on' : '')} onClick=${() => setScope('season')}>Season</button></div>
      ${scope === 'game' ? html`<${GamePicker} gameId=${g.id} setGameId=${setGameId} filter=${tracked} />` : null}</div></div>
    ${scope === 'game' ? html`<div class="summary-strip">
      <div class=${'result ' + result.toLowerCase()}><span class="display big">${A.us}–${A.them}</span><span>${result}</span></div>
      <div class="quarters">${A.byQuarter.map((q, i) => html`<div class="qbox"><span class="muted small">${(g.quarters || 4) === 2 ? 'H' : 'Q'}${i + 1}</span><b>${q.us}–${q.them}</b></div>`)}</div>
      <div class=${'fair-mini ' + (fv.length && Math.max(...fv) - Math.min(...fv) <= 1 ? 'good' : 'warn')}><span class="muted small">Playing time</span><b>${fv.length ? (Math.min(...fv) === Math.max(...fv) ? fv[0] + ' shifts each' : Math.min(...fv) + '–' + Math.max(...fv) + ' shifts') : '–'}</b></div>
    </div>
    <div class="panel"><${ShiftChart} g=${g} A=${A} /></div>` : null}
    <div class="review-grid">
      <div class="panel">
        <h2>Which groups worked</h2>
        <p class="small muted">Score while each exact group of ${onCourtOf(g)} was on the court. ${scope === 'game' ? 'One shift is a hint, not proof.' : 'Groups with more shifts are more reliable.'}</p>
        <table class="data"><thead><tr><th>Group</th><th class="num">Shifts</th><th class="num">Score</th><th class="num">+/-</th></tr></thead>
          <tbody>${lineups.slice(0, 8).map((x, i) => html`<tr class=${i === 0 && x.pm > 0 ? 'best' : ''}><td><${Faces} ids=${x.ids} /></td><td class="num">${x.n}</td><td class="num">${x.us}–${x.them}</td><td class=${'num ' + (x.pm > 0 ? 'pos' : x.pm < 0 ? 'neg' : '')}>${signed(x.pm)}</td></tr>`)}</tbody></table>
      </div>
      <div class="panel">
        <h2>Pairs that click</h2>
        <p class="small muted">Two kids on the court together for ${minPair}+ shifts. Use this to build groups, not to bench anyone.</p>
        ${pairs.length ? html`<div class="pairs">
          <div><span class="eyebrow good-text">Best together</span>${pairs.slice(0, 3).map((x) => html`<div class="pair-row"><${Faces} ids=${x.ids} size=${28} /><span class="grow">${byId[x.ids[0]] ? byId[x.ids[0]].name : ''} + ${byId[x.ids[1]] ? byId[x.ids[1]].name : ''}</span><span class="pos num">${signed(x.pm)}</span><span class="muted small">${x.shifts} sh</span></div>`)}</div>
          ${pairs.slice(-3).some((x) => x.pm < 0) ? html`<div><span class="eyebrow warn-text">Not clicking yet</span>${pairs.slice(-3).reverse().filter((x) => x.pm < 0).map((x) => html`<div class="pair-row"><${Faces} ids=${x.ids} size=${28} /><span class="grow">${byId[x.ids[0]] ? byId[x.ids[0]].name : ''} + ${byId[x.ids[1]] ? byId[x.ids[1]].name : ''}</span><span class="neg num">${signed(x.pm)}</span><span class="muted small">${x.shifts} sh</span></div>`)}</div>` : null}
        </div>` : html`<p class="muted">Not enough shared shifts yet.</p>`}
      </div>
    </div>
    <div class="panel">
      <h2>Player stats</h2>
      <div class="table-scroll"><table class="data players"><thead><tr><th>Player</th>${cols.map(([, l]) => html`<th class="num">${l}</th>`)}</tr></thead>
        <tbody>${ids.map((id) => { const l = P[id]; return html`<tr><td class="who"><${Avatar} p=${byId[id]} size=${26} /> ${byId[id].name}</td>${cols.map(([k]) => {
          const v = k === 'fg' ? l.fgm + '/' + l.fga : k === 'pm' ? signed(l.pm) : l[k];
          const heat = k === 'fg' || k === 'pm' || k === 'to' || k === 'shifts' ? 0 : (l[k] || 0) / maxOf[k];
          return html`<td class=${'num' + (k === 'pm' ? (l.pm > 0 ? ' pos' : l.pm < 0 ? ' neg' : '') : '') + (k === 'to' ? ' muted' : '')} style=${heat ? `--heat:${(heat * 38).toFixed(0)}%` : ''}>${v}</td>`;
        })}</tr>`; })}</tbody></table></div>
      ${scope === 'game' && A.teamUnassigned ? html`<p class="small muted">${A.teamUnassigned} team points weren't credited to a player.</p>` : null}
    </div>
    <${PlaysReview} games=${scope === 'game' ? [g] : season.games} title=${scope === 'game' ? 'Plays this game' : 'Which plays work'} />
    ${scope === 'game' ? html`<${AIReview} g=${g} A=${A} season=${season} />` : null}
    ${scope === 'game' ? html`<${ParentRecap} g=${g} A=${A} season=${season} />` : null}
  </section>`;
}

/* ---------- Grow: development, positions, practice ---------- */
function heatClass(v) { return 'lv' + Math.round(v); }

function aiPracticePrompt(roster, season, tf, minutes) {
  const rows = roster.map((p) => {
    const l = season.players[p.id]; const f = CC.practiceFocus(p, l);
    return `${p.name} | ratings ${CC.SKILLS.map((s) => CC.rating(p, s.k)).join(',')} | focus: ${f}${l && l.games ? ` | per game: pts ${(l.pts / l.games).toFixed(1)}, reb ${(l.reb / l.games).toFixed(1)}, to ${(l.to / l.games).toFixed(1)}` : ''}`;
  });
  return `You are a youth basketball skills coach. Write a ${minutes}-minute practice plan for a 3rd-4th grade team (ages 8-10) with one volunteer coach and maybe a parent helper, one basket area or a half court, and about ${roster.length} kids.

Team skill averages (1-4): ${CC.SKILLS.map((s) => s.name + ' ' + tf.avg[s.k].toFixed(1)).join(', ')}.
Biggest team needs: ${tf.order.slice(0, 3).join(', ')}.
Kids (ratings in order dribbling, passing, shooting, defense, rebounding, spacing, hustle, confidence):
${rows.join('\n')}

Rules: keep kids moving (no long lines), short instructions, games and competitions over lectures, end with something fun. Split into groups when it helps, and name which kids go in which group by need.

Reply with only JSON:
{"title":"short name for this practice","goal":"one sentence","blocks":[{"minutes":8,"name":"drill name","how":"2-3 sentences a parent could run","coachCue":"one phrase to repeat","groups":"optional: who goes where"}],"homework":"one fun thing kids can practice at home"}`;
}

function GrowTab({ openPlayer }) {
  const s = useStore();
  const roster = s.team.roster;

/* ---------- Printable game plan (US Letter, drawn as vectors) ---------- */
let jsPDFLoading = null;

    const sc = document.createElement('script'); sc.src = JSPDF_SRC; sc.onload = () => res(window.jspdf.jsPDF); sc.onerror = () => rej(new Error("Couldn't load the PDF maker. Check your connection."));
    document.head.appendChild(sc);

function avatarJPEG(id) {

    img.onerror = () => res(null); img.src = AVATARS[id] || AVATARS['girl-1'];
  });

async function exportPlanPDF(g) {
  const dl = window.claude ? await window.claude.use('downloads').catch(() => null) : null;

  const doc = new JsPDF({ unit: 'pt', format: 'letter' });
  const W = 612, H = 792, M = 36;
  const byId = rosterById();
  const present = (g.present || []).filter((id) => byId[id]);
  const imgs = {}; for (const id of present) imgs[id] = await avatarJPEG(byId[id].avatarId);
  const N = CC.nShifts(g), spq = g.spq || 2;
  const ink = [17, 28, 51], orange = [236, 106, 30], blue = [44, 103, 214], grey = [110, 120, 140];
  function header(sub) {
    doc.setFont('helvetica', 'bold'); doc.setFontSize(20); doc.setTextColor(...ink); doc.text(Store.s.team.name + ' vs ' + g.opponent, M, M + 14);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.setTextColor(...grey); doc.text(fmtDate(g.date) + (sub ? '  ·  ' + sub : ''), M, M + 32);
  }
  // Page 1: rotation overview
  header('Rotation');
  const top = M + 56, nameW = 130, cw = Math.min(46, (W - 2 * M - nameW - 50) / N), rh = 24;
  doc.setFontSize(10); doc.setFont('helvetica', 'bold'); doc.setTextColor(...ink);
  for (let i = 0; i < N; i++) doc.text(CC.shiftLabel(g, i), M + nameW + i * cw + cw / 2, top, { align: 'center' });
  doc.text('Shifts', M + nameW + N * cw + 22, top, { align: 'center' });
  const counts = CC.shiftCounts(g, present, false);
  present.forEach((id, r) => {
    const y = top + 12 + r * rh;
    if (r % 2 === 0) { doc.setFillColor(243, 245, 248); doc.rect(M, y, nameW + N * cw + 44, rh, 'F'); }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(...ink);
    doc.text('#' + byId[id].number + '  ' + byId[id].name, M + 6, y + 16);
    for (let i = 0; i < N; i++) {
      const cx = M + nameW + i * cw + cw / 2;
      if (i % spq === 0) { doc.setDrawColor(200, 206, 216); doc.line(M + nameW + i * cw, y, M + nameW + i * cw, y + rh); }
      if ((g.shifts[i].lineup || []).includes(id)) { doc.setFillColor(...ink); doc.circle(cx, y + rh / 2, 6, 'F'); }
    }
    doc.setFont('helvetica', 'normal'); doc.text(String(counts[id]), M + nameW + N * cw + 22, y + 16, { align: 'center' });
  });
  let y1 = top + 24 + present.length * rh;
  doc.setFontSize(10); doc.setTextColor(...grey);
  doc.text('A dot means the player is on the court for that shift. Positions for each shift are on the next pages.', M, y1);
  if (g.ai && g.ai.plan && g.ai.plan.summary) { y1 += 18; doc.setTextColor(...ink); doc.text(doc.splitTextToSize('Plan: ' + g.ai.plan.summary, W - 2 * M), M, y1); }
  // Court drawer
  function court(x, y, w, side, shiftIdx, title) {
    const h = w * 0.94; const sx = w / 500, sy = h / 470;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(...(side === 'off' ? orange : blue)); doc.text(title, x, y - 6);
    doc.setDrawColor(...ink); doc.setLineWidth(1.2); doc.setFillColor(250, 246, 238); doc.rect(x, y, w, h, 'FD');
    doc.setFillColor(238, 230, 214); doc.rect(x + 190 * sx, y + 280 * sy, 120 * sx, 190 * sy, 'FD');
    doc.setLineWidth(0.8);
    doc.ellipse(x + 250 * sx, y + 280 * sy, 60 * sx, 60 * sy, 'S');
    { let px = null; for (let a = 0; a <= 180; a += 10) { const r = (a * Math.PI) / 180; const pt = [x + (250 + 60 * Math.cos(r)) * sx, y + 60 * Math.sin(r) * sy]; if (px) doc.line(px[0], px[1], pt[0], pt[1]); px = pt; } }
    // 3pt line as polyline
    const pts = []; for (let a = 180; a <= 360; a += 6) { const r = (a * Math.PI) / 180; pts.push([250 + 197.5 * Math.cos(r), 417.5 + 197.5 * Math.sin(r)]); }
    doc.line(x + 52.5 * sx, y + h, x + 52.5 * sx, y + 417.5 * sy); doc.line(x + 447.5 * sx, y + h, x + 447.5 * sx, y + 417.5 * sy);
    for (let i = 1; i < pts.length; i++) doc.line(x + pts[i - 1][0] * sx, y + pts[i - 1][1] * sy, x + pts[i][0] * sx, y + pts[i][1] * sy);
    doc.circle(x + 250 * sx, y + 417.5 * sy, 7 * sx, 'S'); doc.line(x + 220 * sx, y + 430 * sy, x + 280 * sx, y + 430 * sy);
    const pos = CC.positionsFor(g, shiftIdx, side, Store.s.team.roster);
    const R = Math.max(12, w * 0.055);

      const cx = x + (ps.x / 100) * w, cy = y + (ps.y / 100) * h;
      if (imgs[id]) {
        doc.saveGraphicsState(); doc.circle(cx, cy, R, null); doc.clip(); doc.discardPath();
        doc.addImage(imgs[id], 'JPEG', cx - R, cy - R, R * 2, R * 2, 'av-' + id); doc.restoreGraphicsState();
      }
      doc.setDrawColor(255, 255, 255); doc.setLineWidth(1.5); doc.circle(cx, cy, R, 'S');
      doc.setFillColor(...(side === 'off' ? orange : blue)); doc.circle(cx + R * 0.72, cy + R * 0.72, R * 0.42, 'F');
      doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(Math.max(6, R * 0.5));
      doc.text(String(p.number), cx + R * 0.72, cy + R * 0.72, { align: 'center', baseline: 'middle' });

      doc.setFillColor(255, 255, 255); doc.setDrawColor(200, 206, 216); doc.setLineWidth(0.5); doc.roundedRect(cx - tw / 2, cy + R + 2, tw, R * 0.8, 2, 2, 'FD');
      doc.setTextColor(...ink); doc.text(nm, cx, cy + R + 2 + R * 0.4, { align: 'center', baseline: 'middle' });
    });
    return h;
  }
  // One page per period: each shift gets offense + defense side by side
  const periods = g.quarters || 4;
  for (let q = 0; q < periods; q++) {
    const idxs = []; for (let j = 0; j < spq; j++) idxs.push(q * spq + j);
    if (!idxs.some((i) => (g.shifts[i].lineup || []).length)) continue;
    doc.addPage(); header(((g.quarters || 4) === 2 ? 'Half ' : 'Quarter ') + (q + 1));
    const cwid = (W - 2 * M - 18) / 2;
    const chH = cwid * 0.94;
    const rowsPerPage = spq <= 2 ? 2 : 3;
    const scale = spq <= 2 ? 1 : 0.68;
    let y = M + 68;
    idxs.forEach((i, k) => {
      if (k && k % rowsPerPage === 0) { doc.addPage(); header(((g.quarters || 4) === 2 ? 'Half ' : 'Quarter ') + (q + 1) + ' (cont.)'); y = M + 68; }
      const w = cwid * scale;
      const label = CC.shiftLabel(g, i, true);

      court(M + w + 18, y, w, 'def', i, label + ' · Defense (' + CC.FORMATIONS.def[g.defForm].name + ')');

      CC.lineupOf(g, i).forEach((id) => { if ((g.tips || {})[id] && byId[id]) lines.push(byId[id].name + ': ' + g.tips[id]); });
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(...ink);
      if (lines.length) { const t = doc.splitTextToSize(lines.join('   ·   '), W - 2 * M); doc.text(t, M, ty); ty += t.length * 12; }
      y = ty + 26;
    });
  }
  doc.setProperties({ title: Store.s.team.name + ' vs ' + g.opponent });
  const blob = doc.output('blob');
  try { await dl.save({ filename: 'CourtCoach-vs-' + g.opponent.replace(/[^A-Za-z0-9]+/g, '-') + '.pdf', data: blob }); }
  catch (e) { if (e && e.code === 'declined') return; throw new Error("Couldn't save the PDF here."); }
}

/* ---------- Playbook: animated plays, builder, Claude, play cards ---------- */
const REDUCED_MOTION = (() => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
const toSvg = (p) => [p[0] * 5, p[1] * 4.7];

// Where the players for a play come from.
function castOptions() {
  const s = Store.s, out = [];
  const byId = rosterById();
  const live = sortedGames().find((g) => g.status === 'live');
  if (live) { const ids = CC.lineupOf(live, live.cur || 0).filter((id) => byId[id]); if (ids.length) out.push({ key: 'live', label: 'On the court now (' + CC.shiftLabel(live, live.cur || 0, true) + ')', ids }); }
  const next = sortedGames().filter((g) => g.status === 'plan').sort((a, b) => (a.date || '').localeCompare(b.date || ''))[0];
  if (next) for (let i = 0; i < CC.nShifts(next); i++) { const ids = CC.lineupOf(next, i).filter((id) => byId[id]); if (ids.length) out.push({ key: 'g:' + next.id + ':' + i, label: 'vs ' + next.opponent + ' · ' + CC.shiftLabel(next, i, true), ids }); }
  out.push({ key: 'roster', label: 'Best fits from the whole roster', ids: s.team.roster.map((p) => p.id) });
  out.push({ key: 'none', label: 'No names (show roles)', ids: [] });
  return out;
}
function castFor(play, ids) { const byId = rosterById(); return CCP.castPlay(play, ids.map((id) => byId[id]).filter(Boolean)); }

function arrowEls(list, faint) {
  const out = [];
  list.forEach((a, i) => {
    let [x1, y1] = toSvg(a.from), [x2, y2] = toSvg(a.to);
    const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
    if (len < 30) return;
    const ux = dx / len, uy = dy / len, s0 = 24, s1 = a.kind === 'screen' ? 20 : 30;
    x1 += ux * s0; y1 += uy * s0; x2 -= ux * s1; y2 -= uy * s1;
    const cls = 'pa ' + a.kind + (faint ? ' faint' : '');
    const head = (hx, hy) => { const sz = 16, px = -uy, py = ux; return `${hx + ux * 4},${hy + uy * 4} ${hx - ux * sz + px * sz * 0.6},${hy - uy * sz + py * sz * 0.6} ${hx - ux * sz - px * sz * 0.6},${hy - uy * sz - py * sz * 0.6}`; };
    if (a.kind === 'screen') {
      const px = -uy * 16, py = ux * 16;
      out.push(html`<g key=${i} class=${cls}><path d=${`M${x1} ${y1} L${x2} ${y2}`} /><path d=${`M${x2 + px} ${y2 + py} L${x2 - px} ${y2 - py}`} class="bar" /></g>`);
    } else if (a.kind === 'dribble') {
      const L = Math.hypot(x2 - x1, y2 - y1), n = Math.max(2, Math.floor((L - 22) / 14)); let d = `M${x1} ${y1}`;
      for (let k = 1; k <= n; k++) { const t = (k * 14) / L, side = k % 2 ? 7 : -7; d += ` L${x1 + (x2 - x1) * t - uy * side} ${y1 + (y2 - y1) * t + ux * side}`; }
      d += ` L${x2 - ux * 6} ${y2 - uy * 6}`;
      out.push(html`<g key=${i} class=${cls}><path d=${d} /><polygon points=${head(x2, y2)} /></g>`);
    } else {
      out.push(html`<g key=${i} class=${cls}><path d=${`M${x1} ${y1} L${x2 - ux * 10} ${y2 - uy * 10}`} /><polygon points=${head(x2, y2)} /></g>`);
    }
  });
  return out;
}

// A court that draws a play at a moment in time (step, progress t).
function PlayCourt({ play, cast, step, t = 1, big, editable, onMove, onTap, selected, extraArrows }) {
  const ref = useRef(null);
  const [drag, setDrag] = useState(null);
  const byId = rosterById();
  const prev = CCP.posAt(play, step - 1), cur = CCP.posAt(play, step);
  const tm = step < 0 ? 1 : ease(Math.min(1, t / 0.62)), tb = step < 0 ? 1 : ease(Math.max(0, (t - 0.62) / 0.38));
  const pos = {}; (play.roles || []).forEach((r) => { if (cur[r.key]) pos[r.key] = lerp(prev[r.key] || cur[r.key], cur[r.key], tm); });
  if (drag) pos[drag.key] = [drag.x, drag.y];
  const b0 = CCP.ballAt(play, step - 1), b1 = CCP.ballAt(play, step);
  let ball = null, ballFade = 1;
  if (step < 0) ball = b1 && pos[b1];
  else if (b0 === b1) ball = b1 && pos[b1];
  else if (b0 && b1 && pos[b0] && pos[b1]) ball = tb <= 0 ? pos[b0] : lerp(cur[b0], cur[b1], tb);
  else if (!b0 && b1) { ball = pos[b1]; ballFade = tb; }
  else if (b0 && !b1) { ball = pos[b0]; ballFade = 1 - tb; }
  const arr = extraArrows || (step >= 0 ? CCP.arrows(play, step) : []);
  function pct(e) { const r = ref.current.getBoundingClientRect(); return [CC.clamp(((e.clientX - r.left) / r.width) * 100, -4, 104), CC.clamp(((e.clientY - r.top) / r.height) * 100, 2, 106)]; }
  function down(e, key) {
    if (!editable) { onTap && onTap(key); return; }
    e.preventDefault(); e.currentTarget.setPointerCapture && e.currentTarget.setPointerCapture(e.pointerId);
    setDrag({ key, x: pos[key][0], y: pos[key][1], sx: e.clientX, sy: e.clientY, moved: false });
  }
  function move(e) { if (!drag) return; const [x, y] = pct(e); setDrag({ ...drag, x, y, moved: drag.moved || Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 6 }); }
  function up() { if (!drag) return; if (drag.moved) onMove && onMove(drag.key, Math.round(drag.x * 10) / 10, Math.round(drag.y * 10) / 10); else onTap && onTap(drag.key); setDrag(null); }
  return html`<div class=${'play-wrap' + (big ? ' big' : '')}>
    <div class=${'court play' + (big ? ' big' : '') + (editable ? ' editable' : '')} ref=${ref} onPointerMove=${move} onPointerUp=${up} onPointerCancel=${() => setDrag(null)}>
      <${CourtLines} />
      <svg class="play-arrows" viewBox="0 0 500 470" aria-hidden="true">${arrowEls(arr, step >= 0 && t < 0.62 && !extraArrows)}</svg>
      ${(play.roles || []).map((r) => {
        const p = pos[r.key]; if (!p) return null;
        const pid = cast && cast[r.key]; const pl = pid && byId[pid];
        return html`<button key=${r.key} class=${'token' + (selected === r.key ? ' sel' : '') + (drag && drag.key === r.key ? ' dragging' : '')} style=${`left:${p[0]}%;top:${p[1]}%`} onPointerDown=${(e) => down(e, r.key)} aria-label=${(pl ? pl.name + ', ' : '') + r.label}>
          <span class=${'token-face' + (pl ? '' : ' generic')}>${pl ? html`<img src=${AVATARS[pl.avatarId] || AVATARS['girl-1']} alt="" draggable="false" /><span class="token-num">${pl.number}</span>` : html`<span class="gen-lbl">${r.label.slice(0, 1)}</span>`}</span>
          <span class="token-name">${pl ? pl.name : r.label}</span>
        </button>`;
      })}
      ${ball ? html`<span class="ball" style=${`left:${ball[0]}%;top:${ball[1]}%;opacity:${ballFade}`}></span>` : null}
    </div>
  </div>`;
}

// Animated viewer with controls.
function PlayViewer({ play, cast, big, autoplay }) {
  const n = play.steps.length;
  const [st, setSt] = useState({ step: -1, t: 1, playing: false, one: false });
  const [loop, setLoop] = useState(!!autoplay);
  const [slow, setSlow] = useState(!!big);
  const ref = useRef(st); ref.current = st;
  const hold = useRef(0);
  useEffect(() => { setSt({ step: -1, t: 1, playing: !!autoplay, one: false }); hold.current = autoplay ? 900 : 0; }, [play.id, play]);
  useEffect(() => {
    if (!st.playing && !st.one) return;
    let raf, last = performance.now();
    const dur = REDUCED_MOTION ? 1 : slow ? 2300 : 1400, pause = slow ? 1300 : 800;
    const frame = (now) => {
      const dt = now - last; last = now;
      let { step, t, playing, one } = ref.current;
      if (hold.current > 0) {
        hold.current -= dt;
        if (hold.current <= 0) {
          if (one) { setSt({ step, t: 1, playing: false, one: false }); return; }
          if (step < n - 1) { step++; t = 0; }
          else if (loop) { step = -1; t = 1; hold.current = 1400; setSt({ step, t, playing, one }); raf = requestAnimationFrame(frame); return; }
          else { setSt({ step, t: 1, playing: false, one: false }); return; }
        }
      } else if (step >= 0) {
        t = Math.min(1, t + dt / dur);
        if (t >= 1) hold.current = one ? 1 : pause;
      } else { step = 0; t = 0; }
      setSt({ step, t, playing, one });
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
    return () => cancelAnimationFrame(raf);
  }, [st.playing, st.one, loop, slow, n]);
  function playPause() {
    if (st.playing) { setSt({ ...st, playing: false }); return; }
    if (st.step >= n - 1 && st.t >= 1) { hold.current = 700; setSt({ step: -1, t: 1, playing: true, one: false }); }
    else { hold.current = st.step < 0 ? 300 : 0; setSt({ ...st, playing: true, one: false }); }
  }
  const go = (k) => { hold.current = 0; setSt({ step: k, t: k >= 0 ? 0 : 1, playing: false, one: k >= 0 }); };
  const step = Math.min(st.step, n - 1);
  const say = step < 0 ? 'Starting spots' : play.steps[step].say;
  return html`<div class=${'viewer' + (big ? ' big' : '')}>
    <${PlayCourt} play=${play} cast=${cast} step=${step} t=${step === st.step ? st.t : 1} big=${big} />
    <div class="caption" aria-live="polite"><span class="cap-num">${step < 0 ? 'Start' : step + 1 + ' of ' + n}</span><span class="cap-say">${say}</span></div>
    <div class="vctl">
      <button class="icon-btn" onClick=${() => go(-1)} aria-label="Back to start"><${Icon} name="undo" /></button>
      <button class="icon-btn" onClick=${() => go(Math.max(-1, st.step - 1))} disabled=${st.step < 0} aria-label="Previous step"><${Icon} name="back" /></button>
      <button class="btn primary play-btn" onClick=${playPause}>${st.playing ? 'Pause' : st.step >= n - 1 && st.t >= 1 ? 'Play again' : 'Play'}</button>
      <button class="icon-btn" onClick=${() => go(Math.min(n - 1, st.step + 1))} disabled=${st.step >= n - 1} aria-label="Next step"><${Icon} name="next" /></button>
      <label class="toggle"><input type="checkbox" checked=${loop} onChange=${(e) => setLoop(e.target.checked)} /> Loop</label>
      <label class="toggle"><input type="checkbox" checked=${slow} onChange=${(e) => setSlow(e.target.checked)} /> Slow</label>
    </div>
  </div>`;
}

function RoleList({ play, cast, onSwap }) {
  const byId = rosterById();

/* Full-screen play for the huddle. log = {gameId} to record how it went. */
function PlayHuddle({ playId, log, onClose }) {
  const s = useStore();
  const play = CCP.findPlay(s.team, playId);
  const ref = useRef(null);
  const [done, setDone] = useState(false);
  if (!play) return null;
  const g = log && s.games[log.gameId];
  const opts = castOptions();
  const ids = g ? CC.lineupOf(g, g.cur || 0) : (opts.find((o) => o.key !== 'none') || { ids: [] }).ids;
  const cast = castFor(play, ids);
  function record(res) {
    Store.change((st) => { const gg = st.games[g.id]; gg.playLog = (gg.playLog || []).concat({ id: CC.uid(), s: gg.cur || 0, play: play.id, res, at: Date.now() }); }, [g.id]);
    toast(play.name + ': ' + { score: 'scored', shot: 'got a shot', to: 'turnover', none: "didn't run" }[res]);
    onClose();
  }
  function full() { try { const el = ref.current; (el.requestFullscreen || el.webkitRequestFullscreen).call(el).catch(() => {}); } catch (e) { /* not allowed */ } }
  return html`<div class="huddle play-huddle" ref=${ref} role="dialog" aria-label=${play.name}>
    <div class="huddle-bar"><div class="huddle-title"><span class="display">${play.name}</span><span class="huddle-side off">${(CCP.CATS.find((c) => c[0] === play.cat) || ['', 'Play'])[1]}</span></div></div>
    <div class="huddle-court"><${PlayViewer} play=${play} cast=${cast} big=${true} autoplay=${true} /></div>
    <div class="huddle-foot">
      ${g && !done ? html`<span class="muted">How did it go?</span>
        <button class="btn" onClick=${() => record('score')}>Scored</button><button class="btn" onClick=${() => record('shot')}>Got a shot</button>
        <button class="btn" onClick=${() => record('to')}>Turnover</button><button class="btn ghost" onClick=${() => record('none')}>Didn't run it</button>` : null}
      <button class="btn" onClick=${full}><${Icon} name="full" /> Full screen</button>
      <button class="btn primary" onClick=${onClose}>${g ? 'Close' : 'Done'}</button>
    </div>
  </div>`;
}

function PlayBuilder({ draft, onSave, onClose }) {
  const [d, setD] = useState(() => clone(draft));
  const [k, setK] = useState(-1);
  const [sel, setSel] = useState(null);
  const [preview, setPreview] = useState(false);
  const upd = (fn) => setD((old) => { const n = clone(old); fn(n); return n; });
  const n = d.steps.length;
  function onMove(key, x, y) { upd((p) => { if (k < 0) p.start[key] = [x, y]; else { p.steps[k].moves = p.steps[k].moves || {}; p.steps[k].moves[key] = [x, y]; } }); setSel(key); }
  function addStep() { upd((p) => { p.steps.push({ say: '', moves: {}, screens: [] }); }); setK(n); }
  function delStep() { if (k < 0) return; upd((p) => { p.steps.splice(k, 1); }); setK(k - 1); }
  function addRole() { upd((p) => { if (p.roles.length >= 5) return; let i = p.roles.length + 1; while (p.roles.some((r) => r.key === 'p' + i)) i++; const key = 'p' + i; p.roles.push({ key, type: 'cut', label: 'Player ' + i }); p.start[key] = [50, 50]; }); }
  function delRole(key) { upd((p) => { p.roles = p.roles.filter((r) => r.key !== key); delete p.start[key]; if (p.ball === key) p.ball = null; p.steps.forEach((s) => { delete s.moves[key]; s.screens = (s.screens || []).filter((x) => x !== key); if (s.ball === key) s.ball = null; }); }); }
  const step = k >= 0 ? d.steps[k] : null;
  const prevHolder = k >= 0 ? CCP.ballAt(d, k - 1) : null;
  const prevLabel = prevHolder ? ((d.roles.find((r) => r.key === prevHolder) || {}).label || 'nobody') : 'nobody';
  function save() { try { onSave(CCP.normalizePlay(d, d.id)); } catch (e) { toast(e.message || 'Check the play and try again.'); } }
  return html`<${Dialog} open=${true} onClose=${onClose} title=${draft.custom && draft.steps.length ? 'Edit play' : 'Draw a play'} wide=${true}
      footer=${html`<button class="btn" onClick=${onClose}>Cancel</button><button class="btn primary" onClick=${save} disabled=${!d.name.trim()}><${Icon} name="check" /> Save play</button>`}>
    ${draft.fromAI ? html`<p class="ai-note"><span class="ai-badge"><${Icon} name="spark" /> Claude</span> Here's Claude's version. Press Preview to watch it, drag anyone who's off, then save.</p>` : null}
    <div class="builder">
      <div class="b-court">
        <div class="steps-bar">
          <button class=${'step-chip' + (k < 0 ? ' on' : '')} onClick=${() => { setK(-1); setPreview(false); }}>Start</button>
          ${d.steps.map((_, i) => html`<button class=${'step-chip' + (k === i ? ' on' : '')} onClick=${() => { setK(i); setPreview(false); }}>${i + 1}</button>`)}

function aiPlayPrompt(desc, names) {
  const ex = CCP.STARTER[0];
  const exJson = JSON.stringify({ name: ex.name, cat: ex.cat, desc: ex.desc, roles: ex.roles, start: ex.start, ball: ex.ball, steps: ex.steps });
  return `Draw a youth basketball play (3rd-4th grade girls) as JSON for an app that animates it.

COURT (half court, numbers are percentages): x 0-100 from the left sideline to the right sideline. y 0-100 from the half-court line (y 0) to the baseline (y 100). Our basket is at (50, 89). Lane: x 38-62 from y 60 to y 100. Free-throw line y 60. Blocks (38,85) and (62,85). Elbows (38,60) and (62,60). Top of the arc (50,47). Wings about (18,54) and (82,54). Corners (8,91) and (92,91). Out of bounds: a baseline inbounder stands at y 104; a sideline inbounder at x -4 or 104. For a press break, the bottom basket is the one we defend and players move up toward y 0.

PLAYERS: 3 to 5 roles. Each role has a short key (lowercase letters/digits), a label kids understand, and a type that decides which kid gets the spot: inb (inbounder), pg (ball handler), sh (shooter), scr (screener), cut (cutter), reb (rebounder), safe (safety).

STEPS: 2 to 5 steps. Each step lists only the roles that move ("moves"), which of those moves are screens ("screens"), and "ball" = the role holding the ball at the END of the step (leave it out if it doesn't change; null for a shot). Keep each "say" under 14 words, in simple words for 8-10 year olds. Keep it simple: one main action plus a safety option.

EXAMPLE:
${exJson}

COACH'S REQUEST: "${desc}"
${names.length ? 'Players likely on the court: ' + names.join(', ') + '. Use role labels, not names.' : ''}

Reply with only JSON in the same shape as the example: {"name","cat":"blob|slob|press|set|ft","desc","roles":[...],"start":{...},"ball":"key or null","steps":[...]}`;
}

function AIPlayDialog({ onClose, onDraft, lineupIds }) {

    <div class="chips">${ideas.map((t) => html`<button class="chip-btn" onClick=${() => setDesc(t)}>${t}</button>`)}</div>
    ${st.phase === 'thinking' ? html`<div class="thinking"><span class="dots"><i></i><i></i><i></i></span> Claude is drawing the play.</div>` : null}
    ${st.phase === 'error' ? html`<p class="error">${st.msg}</p>` : null}
    <p class="small muted">You'll see it in the editor to check and adjust before it's saved.</p>
  </${Dialog}>`;
}

function pdfCourt(doc, x, y, w) {
  const h = w * 0.94, sx = w / 500, sy = h / 470;
  doc.setDrawColor(17, 28, 51); doc.setLineWidth(1); doc.setFillColor(250, 246, 238); doc.rect(x, y, w, h, 'FD');
  doc.setFillColor(238, 230, 214); doc.rect(x + 190 * sx, y + 280 * sy, 120 * sx, 190 * sy, 'FD');
  doc.setLineWidth(0.7);
  doc.ellipse(x + 250 * sx, y + 280 * sy, 60 * sx, 60 * sy, 'S');
  const arc = (cx, cy, r, a0, a1, stepDeg) => { let px = null; for (let a = a0; a <= a1 + 0.01; a += stepDeg) { const rr = (a * Math.PI) / 180; const pt = [x + (cx + r * Math.cos(rr)) * sx, y + (cy + r * Math.sin(rr)) * sy]; if (px) doc.line(px[0], px[1], pt[0], pt[1]); px = pt; } };
  arc(250, 0, 60, 0, 180, 10);
  doc.line(x + 52.5 * sx, y + h, x + 52.5 * sx, y + 417.5 * sy); doc.line(x + 447.5 * sx, y + h, x + 447.5 * sx, y + 417.5 * sy);
  arc(250, 417.5, 197.5, 180, 360, 6);
  doc.circle(x + 250 * sx, y + 417.5 * sy, 7 * sx, 'S'); doc.line(x + 220 * sx, y + 430 * sy, x + 280 * sx, y + 430 * sy);
  return h;
}
function pdfArrow(doc, a, X, Y, num) {
  let [x1, y1] = [X(a.from[0]), Y(a.from[1])], [x2, y2] = [X(a.to[0]), Y(a.to[1])];
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy); if (len < 8) return;
  const ux = dx / len, uy = dy / len; x1 += ux * 9; y1 += uy * 9; x2 -= ux * 11; y2 -= uy * 11;
  const pass = a.kind === 'pass';
  doc.setLineWidth(1.1); if (pass) { doc.setDrawColor(232, 98, 26); doc.setFillColor(232, 98, 26); doc.setLineDashPattern([3, 2], 0); } else { doc.setDrawColor(17, 28, 51); doc.setFillColor(17, 28, 51); doc.setLineDashPattern([], 0); }
  if (a.kind === 'dribble') {
    const L = Math.hypot(x2 - x1, y2 - y1), n = Math.max(2, Math.floor((L - 6) / 5)); let px = x1, py = y1;
    for (let k = 1; k <= n; k++) { const t = (k * 5) / L, side = k % 2 ? 2.2 : -2.2; const nx = x1 + (x2 - x1) * t - uy * side, ny = y1 + (y2 - y1) * t + ux * side; doc.line(px, py, nx, ny); px = nx; py = ny; }
    doc.line(px, py, x2, y2);
  } else doc.line(x1, y1, x2, y2);
  doc.setLineDashPattern([], 0);
  if (a.kind === 'screen') { doc.setLineWidth(1.6); doc.line(x2 - uy * 5, y2 + ux * 5, x2 + uy * 5, y2 - ux * 5); }
  else { const s = 5; doc.triangle(x2 + ux * 2, y2 + uy * 2, x2 - ux * s - uy * s * 0.6, y2 - uy * s + ux * s * 0.6, x2 - ux * s + uy * s * 0.6, y2 - uy * s - ux * s * 0.6, 'F'); }
  if (num) { const mx = (x1 + x2) / 2, my = (y1 + y2) / 2; doc.setFillColor(255, 255, 255); doc.setDrawColor(17, 28, 51); doc.setLineWidth(0.6); doc.circle(mx, my, 4.2, 'FD'); doc.setTextColor(17, 28, 51); doc.setFont('helvetica', 'bold'); doc.setFontSize(6.5); doc.text(String(num), mx, my, { align: 'center', baseline: 'middle' }); }
}
function pdfPlayCard(doc, play, cast, byId, x, y, w) {
  doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(17, 28, 51); doc.text(play.name, x, y + 10);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(110, 120, 140); doc.text((CCP.CATS.find((c) => c[0] === play.cat) || ['', 'Play'])[1], x + w, y + 10, { align: 'right' });
  const cy = y + 18, ch = pdfCourt(doc, x, cy, w);
  const X = (v) => x + (v / 100) * w, Y = (v) => cy + (v / 100) * ch;
  play.steps.forEach((_, k) => CCP.arrows(play, k).forEach((a, i) => pdfArrow(doc, a, X, Y, i === 0 ? k + 1 : null)));
  const R = w * 0.03;
  play.roles.forEach((r) => {
    const p = play.start[r.key]; if (!p) return; const pid = cast[r.key], pl = pid && byId[pid];
    const cx = X(p[0]), cyy = Y(p[1]);
    doc.setFillColor(17, 28, 51); doc.setDrawColor(255, 255, 255); doc.setLineWidth(1); doc.circle(cx, cyy, R, 'FD');
    doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(R * 0.95); doc.text(pl ? String(pl.number) : r.label.slice(0, 1), cx, cyy, { align: 'center', baseline: 'middle' });
    doc.setFont('helvetica', 'bold'); doc.setFontSize(6.5); doc.setTextColor(17, 28, 51); const nm = pl ? pl.name : r.label; const tw = doc.getTextWidth(nm) + 4;
    const lx = p[0] > 82 ? cx - R - 1 - tw : cx + R + 1;
    doc.setFillColor(255, 255, 255); doc.roundedRect(lx, cyy - 4, tw, 8, 1.5, 1.5, 'F'); doc.text(nm, lx + 2, cyy, { baseline: 'middle' });
  });
  if (play.ball && play.start[play.ball]) { const p = play.start[play.ball]; doc.setFillColor(232, 98, 26); doc.circle(X(p[0]) - R * 0.9, Y(p[1]) + R * 0.6, R * 0.42, 'F'); }
  let ty = cy + ch + 30; doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(17, 28, 51);
  play.steps.forEach((s, k) => { const lines = doc.splitTextToSize((k + 1) + '. ' + s.say, w); doc.text(lines, x, ty); ty += lines.length * 10.5; });
}
async function exportPlayCards(plays, ids) {
  const dl = window.claude ? await window.claude.use('downloads').catch(() => null) : null;

  const JsPDF = await loadJsPDF();

  const byId = rosterById(), M = 30, colW = (612 - 2 * M - 18) / 2, w = 232;

    if (i && i % 4 === 0) doc.addPage();
    const slot = i % 4, col = slot % 2, row = Math.floor(slot / 2);

  catch (e) { if (e && e.code === 'declined') return; throw new Error("Couldn't save the PDF here."); }
}

let audioCtx = null;
function primeAudio() { try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) { audioCtx = null; } }
function beep() {
  try {
    if (!audioCtx) return;
    [0, 0.32].forEach((d) => { const o = audioCtx.createOscillator(), gn = audioCtx.createGain(); o.frequency.value = 880; o.connect(gn); gn.connect(audioCtx.destination); gn.gain.setValueAtTime(0.0001, audioCtx.currentTime + d); gn.gain.exponentialRampToValueAtTime(0.4, audioCtx.currentTime + d + 0.02); gn.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d + 0.25); o.start(audioCtx.currentTime + d); o.stop(audioCtx.currentTime + d + 0.27); });
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  } catch (e) { /* sound not allowed here */ }
}
function mmss(ms) { const t = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }

function ClockPanel({ g, go }) {
  const s = useStore();
  const [now, setNow] = useState(Date.now());
  const alerted = useRef({});
  const clock = g.clock || {};
  const lenS = clock.len || ((s.team.settings || {}).periodMin || 6) * 60;
  const running = !!clock.run;
  useEffect(() => { if (!running) return; const t = setInterval(() => setNow(Date.now()), 500); return () => clearInterval(t); }, [running]);
  const el = CCP.clockElapsed(clock, running ? now : Date.now());
  const spq = g.spq || 2, N = CC.nShifts(g), cur = Math.min(g.cur || 0, N - 1), q = Math.floor(cur / spq), part = cur - q * spq;
  const periods = g.quarters || 4, pname = periods === 2 ? 'Half ' : 'Q';
  let due = null;
  for (let j = 1; j < spq; j++) if (el >= (lenS * 1000 * j) / spq && part < j) { due = { kind: 'sub', key: q + ':' + j }; break; }
  const over = el >= lenS * 1000;
  if (over && !due) due = { kind: 'end', key: q + ':end' };
  useEffect(() => { if (due && running && !alerted.current[due.key]) { alerted.current[due.key] = true; beep(); } });
  function setClock(c) { Store.change((st) => { st.games[g.id].clock = c; if (st.games[g.id].status === 'plan') st.games[g.id].status = 'live'; }, [g.id]); }
  function start() { primeAudio(); setClock({ len: lenS, el: clock.el || 0, run: Date.now() }); setNow(Date.now()); }
  function pause() { setClock({ len: lenS, el: CCP.clockElapsed(clock, Date.now()), run: null }); }
  function reset() { alerted.current = {}; setClock({ len: lenS, el: 0, run: null }); }
  function setLen(min) { Store.change((st) => { st.team.settings = { ...(st.team.settings || {}), periodMin: min }; }, ['team']); setClock({ len: min * 60, el: clock.el || 0, run: clock.run || null }); }
  function nextPeriod() { alerted.current = {}; Store.change((st) => { const gg = st.games[g.id]; gg.cur = Math.min(N - 1, (q + 1) * spq); gg.clock = { len: lenS, el: 0, run: null }; }, [g.id]); }
  const marks = []; for (let j = 1; j < spq; j++) marks.push(j / spq);
  const pct = Math.min(1, el / (lenS * 1000));
  return html`<div class=${'panel clock-panel' + (due ? ' due' : '')}>
    <div class="clock-row">
      <div class="clock">
        <span class="clock-label">${pname}${q + 1} clock</span>
        <span class="clock-time">${mmss(lenS * 1000 - el)}</span>
        <div class="clock-bar"><span style=${`width:${pct * 100}%`}></span>${marks.map((m) => html`<i style=${`left:${m * 100}%`}></i>`)}</div>
      </div>
      <div class="row gap wrap">
        ${running ? html`<button class="btn" onClick=${pause}>Pause</button>` : html`<button class="btn primary" onClick=${start} disabled=${over}>${el > 0 ? 'Resume' : 'Start clock'}</button>`}
        <button class="btn ghost" onClick=${reset}>Reset</button>
        <label class="field compact"><span class="sr">Period length</span><select id="clock-len" value=${Math.round(lenS / 60)} onChange=${(e) => setLen(+e.target.value)}>${[4, 5, 6, 7, 8, 10, 12].map((m) => html`<option value=${m}>${m} min ${periods === 2 ? 'halves' : 'quarters'}</option>`)}</select></label>
      </div>
    </div>
    ${due && due.kind === 'sub' ? html`<div class="due-banner"><b>Time to sub!</b> Midpoint of ${pname}${q + 1}.</div>` : null}
    ${due && due.kind === 'end' ? html`<div class="due-banner"><b>End of ${pname}${q + 1}.</b> ${q + 1 < periods ? html`<button class="btn primary" onClick=${nextPeriod}>Start ${pname}${q + 2} lineup</button>` : 'That’s the game!'}</div>` : null}
    ${!(due && due.kind === 'end') ? html`<${ChangeCard} g=${g} onChange=${() => go(Math.min(N - 1, cur + 1))} />` : null}
    <p class="small muted">The clock beeps at the midpoint and the end of each period. Pause it when the ref stops play.</p>
  </div>`;
}

function TimeoutCard({ g, onClose, openPlay }) {
  const s = useStore();
  const names = {}; s.team.roster.forEach((p) => { names[p.id] = p.name; });
  const opp = (s.team.opponents || {})[CCP.oppKey(g.opponent)];
  const tc = CCP.timeoutCard(g, opp, names);
  const sug = CCP.suggestPlay(s.team, Object.values(s.games), opp);
  const play = CCP.findPlay(s.team, sug.id);
  const spq = g.spq || 2, q = Math.floor((g.cur || 0) / spq);
  return html`<${Dialog} open=${true} onClose=${onClose} title=${'Timeout · ' + ((g.quarters || 4) === 2 ? 'Half ' : 'Q') + (q + 1)} wide=${true}>
    <p class="muted">This period: ${s.team.name} ${tc.period.us}, ${g.opponent} ${tc.period.them}</p>
    <ol class="to-list">
      ${tc.fixes.map((f) => html`<li class="to-fix"><b>${f.title}</b><span>${f.say}</span></li>`)}
      ${!tc.fixes.length ? html`<li class="to-fix calm"><b>Keep doing what you're doing</b><span>Nothing jumps out in the stats. Remind them of one thing from practice.</span></li>` : null}
      <li class="to-good"><b>${tc.good.title}</b><span>${tc.good.say}</span></li>
    </ol>
    ${play ? html`<div class="to-play"><div><span class="eyebrow">Play to run</span><b>${play.name}</b><span class="small muted"> ${sug.why}</span></div><button class="btn primary" onClick=${() => { onClose(); openPlay(play.id); }}><${Icon} name="full" /> Show the team</button></div>` : null}
    <${ChangeCard} g=${g} compact=${true} onChange=${() => { Store.change((st) => { st.games[g.id].cur = Math.min(CC.nShifts(g) - 1, (g.cur || 0) + 1); }, [g.id]); onClose(); }} />
  </${Dialog}>`;
}

function PlayPicker({ g, onClose, openPlay }) {
  const s = useStore();
  const starred = new Set(CCP.stars(s.team));
  const plays = CCP.allPlays(s.team).filter((p) => starred.has(p.id));
  const games = Object.values(s.games);
  return html`<${Dialog} open=${true} onClose=${onClose} title="Run a play" wide=${true}>
    <p class="small muted">Fills in with the five on the court now. After the play, tap how it went.</p>
    ${CCP.CATS.map(([k, label]) => { const items = plays.filter((p) => (p.cat || 'custom') === k); if (!items.length) return null; return html`<div class="pp-group"><span class="eyebrow">${label}</span><div class="pp-grid">
      ${items.map((p) => { const st = CCP.playStats(games, p.id); return html`<button class="pp-btn" onClick=${() => { onClose(); openPlay(p.id); }}><b>${p.name}</b><span class="small muted">${st.runs ? st.score + ' of ' + st.runs + ' scored' : 'Not run yet'}</span></button>`; })}
    </div></div>`; })}
    ${!plays.length ? html`<p class="muted">Star plays on the Plays tab to put them here.</p>` : null}
  </${Dialog}>`;
}

/* ---------- opponent notes ---------- */
function OpponentPanel({ g, openPlay }) {
  const s = useStore();
  const key = CCP.oppKey(g.opponent);
  const opp = (s.team.opponents || {})[key] || { name: g.opponent, tags: [], notes: '' };
  const [open, setOpen] = useState(!!(opp.tags.length || opp.notes));
  const past = sortedGames().filter((x) => x.id !== g.id && x.status === 'final' && CCP.oppKey(x.opponent) === key).map((x) => ({ x, a: CC.analyzeGame(x) }));
  function save(fn) { Store.change((st) => { const all = { ...(st.team.opponents || {}) }; const o = { name: g.opponent, tags: [], notes: '', ...(all[key] || {}) }; fn(o); o.updatedAt = Date.now(); all[key] = o; st.team.opponents = all; }, ['team']); }
  const tips = opp.tags.map((t) => CCP.OPP_TAGS[t]).filter(Boolean);
  const offSug = tips.map((t) => t.off).find(Boolean), defSug = tips.map((t) => t.def).find(Boolean);
  const playIds = Array.from(new Set(tips.flatMap((t) => t.plays)));
  return html`<div class="panel opp-panel">
    <button class="panel-head as-btn" onClick=${() => setOpen(!open)} aria-expanded=${open}><h2>Scouting: ${g.opponent}</h2><span class="small muted">${past.length ? 'Played ' + past.length + 'x: ' + past.map((p) => p.a.us + '–' + p.a.them).join(', ') : 'First time playing them'} ${open ? '▲' : '▼'}</span></button>
    ${open ? html`<div class="opp-body">
      <div class="chips">${Object.entries(CCP.OPP_TAGS).map(([k, t]) => html`<button class=${'chip-btn' + (opp.tags.includes(k) ? ' on' : '')} aria-pressed=${opp.tags.includes(k)} onClick=${() => save((o) => { o.tags = o.tags.includes(k) ? o.tags.filter((x) => x !== k) : o.tags.concat(k); })}>${t.label}</button>`)}</div>
      <label class="field"><span>Notes</span><textarea id="opp-notes" rows="2" value=${opp.notes} onChange=${(e) => save((o) => { o.notes = e.target.value; })} placeholder="e.g. #5 is tall. They pressed after every basket."></textarea></label>
      ${tips.length ? html`<div class="opp-sug"><span class="eyebrow">Game plan ideas</span><ul>${tips.map((t) => html`<li>${t.tip}</li>`)}</ul>
        <div class="row gap wrap">
          ${offSug && offSug !== g.offForm ? html`<button class="btn small" onClick=${() => Store.change((st) => { st.games[g.id].offForm = offSug; st.games[g.id].shifts.forEach((x) => { x.offPos = {}; }); }, [g.id])}>Use ${CC.FORMATIONS.off[offSug].name} offense</button>` : null}
          ${defSug && defSug !== g.defForm ? html`<button class="btn small" onClick=${() => Store.change((st) => { st.games[g.id].defForm = defSug; st.games[g.id].shifts.forEach((x) => { x.defPos = {}; }); }, [g.id])}>Use ${CC.FORMATIONS.def[defSug].name}</button>` : null}
          ${playIds.map((id) => { const p = CCP.findPlay(s.team, id); return p ? html`<button class="btn small ghost-acc" onClick=${() => openPlay(id)}>Play: ${p.name}</button>` : null; })}
        </div></div>` : html`<p class="small muted">Tag what they do and you'll get formation and play ideas here and in your timeout card.</p>`}
    </div>` : null}
  </div>`;
}

/* ---------- home challenges ---------- */
function ChallengesPanel() {
  const s = useStore();
  const [week, setWeek] = useState(CCP.mondayOf(todayISO()));
  const [copied, setCopied] = useState(false);
  const roster = s.team.roster;
  const wk = ((s.team.challenges || {}).weeks || {})[week];
  const season = useMemo(() => CC.analyzeSeason(Object.values(s.games)), [s.games]);
  function save(fn) { Store.change((st) => { const c = { weeks: {}, ...(st.team.challenges || {}) }; c.weeks = { ...c.weeks }; const w = { team: 'drib', personal: {}, done: {}, pdone: {}, ...(c.weeks[week] || {}) }; fn(w); c.weeks[week] = w; st.team.challenges = c; }, ['team']); }
  function setup() { const tf = CC.teamFocus(roster, season); save((w) => { w.team = tf.order[0]; w.personal = {}; roster.forEach((p) => { w.personal[p.id] = CC.practiceFocus(p, season.players[p.id]); }); }); }
  const wkLabel = (() => { const [y, m, d] = week.split('-').map(Number); return 'Week of ' + new Date(y, m - 1, d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); })();
  const text = wk ? `${s.team.name} home challenges, ${wkLabel.toLowerCase()}\n\nTeam challenge: ${CCP.CHALLENGES[wk.team].title}. ${CCP.CHALLENGES[wk.team].how}\n\nPersonal challenges:\n` + roster.map((p) => { const c = CCP.CHALLENGES[(wk.personal || {})[p.id]]; return c ? `• ${p.name}: ${c.title}. ${c.how}` : null; }).filter(Boolean).join('\n') + `\n\nKids check off at practice and earn the Home Hero badge!` : '';
  async function copy() { try { await navigator.clipboard.writeText(text); setCopied(true); setTimeout(() => setCopied(false), 2000); } catch (e) { setCopied('fail'); } }
  const doneN = wk ? roster.filter((p) => wk.done && wk.done[p.id]).length : 0;
  return html`<div class="panel">
    <div class="panel-head"><h2>Home challenges</h2>
      <div class="shift-step"><button class="icon-btn" onClick=${() => setWeek(CCP.shiftWeek(week, -1))} aria-label="Previous week"><${Icon} name="back" /></button><b class="wk-label">${wkLabel}</b><button class="icon-btn" onClick=${() => setWeek(CCP.shiftWeek(week, 1))} aria-label="Next week"><${Icon} name="next" /></button></div></div>
    ${!wk ? html`<div class="empty small">No challenges set for this week.<br /><button class="btn primary" onClick=${setup}>Set up this week</button><br /><span class="muted">Picks a team challenge from your team's biggest need and a personal one for each kid from her practice focus.</span></div>` : html`
      <div class="row gap wrap"><label class="field grow"><span>Team challenge</span><select id="ch-team" value=${wk.team} onChange=${(e) => save((w) => { w.team = e.target.value; })}>${Object.entries(CCP.CHALLENGES).map(([k, c]) => html`<option value=${k}>${c.title}</option>`)}</select></label>
        <span class="chip good">${doneN} of ${roster.length} done</span></div>
      <p class="small">${CCP.CHALLENGES[wk.team].how}</p>
      <div class="table-scroll"><table class="data ch-table"><thead><tr><th>Player</th><th>Team</th><th>Personal challenge</th><th>Done</th><th class="num">Season</th></tr></thead>
        <tbody>${roster.map((p) => html`<tr key=${p.id}>
          <td class="who"><${Avatar} p=${p} size=${26} /> ${p.name}</td>
          <td><button class=${'check' + (wk.done && wk.done[p.id] ? ' on' : '')} aria-pressed=${!!(wk.done && wk.done[p.id])} aria-label=${p.name + ' team challenge'} onClick=${() => save((w) => { w.done = { ...(w.done || {}) }; if (w.done[p.id]) delete w.done[p.id]; else w.done[p.id] = 1; })}>${wk.done && wk.done[p.id] ? '✓' : ''}</button></td>
          <td><select aria-label=${p.name + ' personal challenge'} value=${(wk.personal || {})[p.id] || 'drib'} onChange=${(e) => { const v = e.target.value; save((w) => { w.personal = { ...(w.personal || {}), [p.id]: v }; }); }}>${Object.entries(CCP.CHALLENGES).map(([k, c]) => html`<option value=${k}>${c.title}</option>`)}</select></td>
          <td><button class=${'check' + (wk.pdone && wk.pdone[p.id] ? ' on' : '')} aria-pressed=${!!(wk.pdone && wk.pdone[p.id])} aria-label=${p.name + ' personal challenge done'} onClick=${() => save((w) => { w.pdone = { ...(w.pdone || {}) }; if (w.pdone[p.id]) delete w.pdone[p.id]; else w.pdone[p.id] = 1; })}>${wk.pdone && wk.pdone[p.id] ? '✓' : ''}</button></td>
          <td class="num">${CCP.challengeCount(s.team, p.id)}</td></tr>`)}</tbody></table></div>
      <div class="row gap wrap"><button class="btn" onClick=${copy}><${Icon} name="copy" /> ${copied === true ? 'Copied' : 'Copy for parents'}</button><button class="btn ghost" onClick=${setup}>Re-pick from latest skills</button></div>
      ${copied === 'fail' ? html`<textarea class="copy-fallback" rows="8" readonly value=${text}></textarea>` : null}
      <p class="small muted">3 finished challenges earn the Home Hero badge on a player card.</p>`}
  </div>`;
}

/* ---------- parent recap ---------- */
function ParentRecap({ g, A, season }) {
  const s = useStore();
  const tf = CC.teamFocus(s.team.roster, season);
  const wk = ((s.team.challenges || {}).weeks || {})[CCP.mondayOf(todayISO())] || ((s.team.challenges || {}).weeks || {})[CCP.mondayOf(g.date || todayISO())];
  const base = CCP.parentRecap(s.team, g, A, season, wk, tf.order[0]);
  const [txt, setTxt] = useState(base);
  const [st, setSt] = useState({ phase: 'idle' });
  const [copied, setCopied] = useState(false);
  const aiOk = useAIAvailable();
  const ctl = useRef(null);
  useEffect(() => { setTxt(base); setSt({ phase: 'idle' }); }, [g.id]);
  async function polish() {
    const sample = await AI.get(); if (!sample) { setSt({ phase: 'error', msg: AI.message({ code: 'not_granted' }) }); return; }
    ctl.current = new AbortController(); setSt({ phase: 'thinking' });
    const shout = g.ai && g.ai.review && g.ai.review.shoutouts ? Object.entries(g.ai.review.shoutouts).map(([id, t]) => (rosterById()[id] || {}).name + ': ' + t).join('\n') : '';
    try {
      const r = await sample(`Rewrite this message for a youth basketball team's parent group chat (3rd-4th grade girls). Make it warm, upbeat and easy to read on a phone, under 140 words. Keep every player's name and every fact. Never mention turnovers, mistakes, or compare kids negatively. Keep the line about practice and the home challenge. Reply with only the message.\n\n${txt}${shout ? '\n\nCoach shout-outs you may weave in:\n' + shout : ''}`, { signal: ctl.current.signal, cache: false, onText: ({ text }) => setTxt(text) });
      setTxt(r.text.trim()); setSt({ phase: 'idle' });
    } catch (e) { if (e && e.text) setTxt(e.text); setSt({ phase: 'error', msg: AI.message(e) }); }
  }
  async function copy() { try { await navigator.clipboard.writeText(txt); setCopied(true); setTimeout(() => setCopied(false), 2000); } catch (e) { setCopied('fail'); toast('Select the text and copy it yourself.'); } }
  return html`<div class="panel">
    <div class="panel-head"><h2>Parent recap</h2><div class="row gap wrap">
      ${aiOk !== false ? (st.phase === 'thinking' ? html`<button class="btn" onClick=${() => ctl.current && ctl.current.abort()}>Stop</button>` : html`<button class="btn ai" onClick=${polish}><${Icon} name="spark" /> Polish with Claude</button>`) : null}
      <button class="btn primary" onClick=${copy}><${Icon} name="copy" /> ${copied === true ? 'Copied' : 'Copy'}</button></div></div>
    <p class="small muted">Positive only: every kid gets a highlight, no turnovers. Edit anything before you paste it in the group chat.</p>
    <textarea id="recap-txt" class="recap" rows="12" value=${txt} onInput=${(e) => setTxt(e.target.value)}></textarea>
    ${st.phase === 'error' ? html`<p class="error">${st.msg}</p>` : null}
    ${txt !== base ? html`<button class="link-btn small" onClick=${() => setTxt(base)}>Start over from the stats</button>` : null}
  </div>`;
}

/* ---------- plays in review ---------- */
function PlaysReview({ games, title }) {
  const s = useStore();
  const rows = CCP.allPlays(s.team).map((p) => ({ p, st: CCP.playStats(games, p.id) })).filter((r) => r.st.runs).sort((a, b) => (b.st.score / b.st.runs) - (a.st.score / a.st.runs) || b.st.runs - a.st.runs);
  return html`<div class="panel">
    <h2>${title}</h2>
    ${rows.length ? html`<table class="data"><thead><tr><th>Play</th><th class="num">Runs</th><th class="num">Scored</th><th class="num">Shot</th><th class="num">Turnover</th><th>Works</th></tr></thead>
      <tbody>${rows.map(({ p, st }) => html`<tr><td><b>${p.name}</b></td><td class="num">${st.runs}</td><td class="num pos">${st.score}</td><td class="num">${st.shot}</td><td class="num neg">${st.to}</td>
        <td><span class="rate"><span style=${`width:${Math.round(((st.score + 0.4 * st.shot) / st.runs) * 100)}%`}></span></span></td></tr>`)}</tbody></table>
      <p class="small muted">"Works" counts a score fully and a good shot partly. A few runs is a hint, not proof.</p>` : html`<p class="muted">No plays logged yet. On Game day, tap Plays, show one, then tap how it went.</p>`}
  </div>`;
}

/* ---------- app shell ---------- */
const TABS = [['team', 'Team'], ['plan', 'Game plan'], ['live', 'Game day'], ['plays', 'Plays'], ['review', 'Review'], ['grow', 'Grow']];

function SyncChip() {
  useStore();
  const m = {
    example: ['Example team', 'warn', 'You are looking at an example. Start your team to save.'],
    local: ['Saved on this device', 'muted', 'Sign in to Claude to save to your account.'],
    loading: ['Loading…', 'muted', ''], saving: ['Saving…', 'muted', ''], saved: ['Saved', 'good', 'Saved to your Claude account.'],
    offline: ['Offline · saved here', 'warn', 'Changes are kept on this device and sync when you reconnect.']
  }[Sync.status] || ['', '', ''];
  return html`<span class=${'sync ' + m[1]} title=${m[2]}><i></i>${m[0]}</span>`;
}

function ExampleBanner({ onStart }) {
  return html`<div class="example-banner">
    <div><b>This is an example team</b> so you can try everything: planning, live stats, reviews and Claude. Nothing here is saved.</div>
    <div class="row gap wrap"><button class="btn primary" onClick=${onStart}>Start my team</button></div>
  </div>`;
}

function StartDialog({ open, onClose, openImport }) {
  const [name, setName] = useState('');
  if (!open) return null;
  function start() {
    Store.change((s) => {
      s.example = false;
      s.team = { name: name.trim() || 'My team', season: '', settings: { onCourt: 5, quarters: 4, spq: 2 }, roster: [], updatedAt: Date.now() };
      s.games = {};
    }, ['team']);
    onClose();
    location.hash = 'team';
    toast('Your team is ready. Add players, then rate their skills.');
  }
  return html`<${Dialog} open=${open} onClose=${onClose} title="Start your team"
      footer=${html`<button class="btn" onClick=${onClose}>Keep exploring</button><button class="btn primary" onClick=${start}>Start with an empty roster</button>`}>
    <label class="field"><span>Team name</span><input id="start-name" value=${name} onInput=${(e) => setName(e.target.value)} placeholder="e.g. Wildcats" /></label>
    <p class="small muted">The example team goes away. Your team saves to your Claude account so it's on your phone and tablet. Coming from the old CourtCoach? Start, then use <b>Import from old CourtCoach</b> on the Team tab.</p>
  </${Dialog}>`;
}

function Toast() {
  useStore();
  const t = Store.ui.toast;
  if (!t) return null;
  return html`<div class="toast" role="status">${t.msg}${t.action ? html`<button class="link-btn" onClick=${() => { t.action.fn(); Store.ui.toast = null; Store.notify(); }}>${t.action.label}</button>` : null}</div>`;
}

function readHash() { const h = (location.hash || '').replace('#', ''); return TABS.some(([k]) => k === h) ? h : 'team'; }

function App() {
  const s = useStore();
  const [tab, setTab] = useState(readHash());
  const [player, setPlayer] = useState(null);
  const [card, setCard] = useState(null);
  const [huddle, setHuddle] = useState(null);
  const [startOpen, setStartOpen] = useState(false);
  const [selPlay, setSelPlay] = useState('box');
  const [playHuddle, setPlayHuddle] = useState(null);
  const openPlay = (id) => { setSelPlay(id); location.hash = 'plays'; };
  const openPlayHuddle = (id, log) => setPlayHuddle({ id, log });
  const pickDefault = () => { const gs = sortedGames(); const live = gs.find((g) => g.status === 'live'); const next = gs.filter((g) => g.status === 'plan').sort((a, b) => (a.date || '').localeCompare(b.date || ''))[0]; return (live || next || gs[0] || {}).id || ''; };
  const [gameId, setGameId] = useState(pickDefault);
  useEffect(() => { const f = () => setTab(readHash()); window.addEventListener('hashchange', f); return () => window.removeEventListener('hashchange', f); }, []);
  useEffect(() => { if (!s.games[gameId]) setGameId(pickDefault()); });
  useEffect(() => { if (window.claude && window.claude.hot) window.claude.hot.snapshot(() => ({ tab, gameId })); }, [tab, gameId]);
  const openHuddle = (gid, sh) => setHuddle({ gid, sh });
  return html`<div class="app">
    <header class="topbar">
      <div class="brand"><span class="logo" aria-hidden="true"><${Icon} name="ball" size=${22} /></span><span class="wordmark">CourtCoach</span><span class="edition">youth edition</span></div>
      <nav class="tabs" role="tablist" aria-label="Sections">${TABS.map(([k, l]) => html`<a role="tab" aria-selected=${tab === k} class=${'tab' + (tab === k ? ' on' : '')} href=${'#' + k}>${l}</a>`)}</nav>
      <${SyncChip} />
    </header>
    ${s.example ? html`<${ExampleBanner} onStart=${() => setStartOpen(true)} />` : null}
    <main>
      ${tab === 'team' ? html`<${TeamTab} openPlayer=${setPlayer} openCard=${setCard} />` : null}
      ${tab === 'plan' ? html`<${PlanTab} gameId=${gameId} setGameId=${setGameId} openHuddle=${openHuddle} openPlay=${openPlay} />` : null}
      ${tab === 'live' ? html`<${LiveTab} gameId=${gameId} setGameId=${setGameId} openHuddle=${openHuddle} openPlayHuddle=${openPlayHuddle} />` : null}
      ${tab === 'plays' ? html`<${PlaysTab} selPlay=${selPlay} setSelPlay=${setSelPlay} openPlayHuddle=${(id) => openPlayHuddle(id, null)} />` : null}
      ${tab === 'review' ? html`<${ReviewTab} gameId=${gameId} setGameId=${setGameId} />` : null}
      ${tab === 'grow' ? html`<${GrowTab} openPlayer=${setPlayer} />` : null}
    </main>
    ${player ? html`<${PlayerSheet} id=${player} onClose=${() => setPlayer(null)} openCard=${(id) => { setPlayer(null); setCard(id); }} />` : null}
    ${card ? html`<${PlayerCard} id=${card} onClose=${() => setCard(null)} />` : null}
    ${huddle ? html`<${Huddle} gameId=${huddle.gid} startShift=${huddle.sh} onClose=${() => setHuddle(null)} />` : null}
    ${playHuddle ? html`<${PlayHuddle} playId=${playHuddle.id} log=${playHuddle.log} onClose=${() => setPlayHuddle(null)} />` : null}
    <${StartDialog} open=${startOpen} onClose=${() => setStartOpen(false)} />
    <${Toast} />
  </div>`;
}

function boot(hot) {
  Store.init();
  document.getElementById('root').textContent = '';
  render(html`<${App} />`, document.getElementById('root'));
  if (hot && hot.tab && !location.hash) location.hash = hot.tab;
  Sync.start();
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});


</script>
</body>
</html>
